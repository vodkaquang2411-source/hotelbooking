<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập Tài Khoản - HotelBooking</title>
  
  <!-- Google Material Symbols Outlined & Material Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Main Stylesheets -->
  <link rel="stylesheet" href="../../css/style.css?v=11.0">
  <link rel="stylesheet" href="../../css/components.css?v=11.0">
  <link rel="stylesheet" href="../../css/responsive.css?v=11.0">
</head>
<body style="background: linear-gradient(135deg, #F8F6F0 0%, #EFEBE1 100%); min-height: 100vh; display: flex; flex-direction: column;">

  <!-- Simple Header -->
  <header style="padding: 20px 0; text-align: center;">
    <div class="container">
      <a href="../../index.html" class="brand-logo" style="justify-content: center; display: inline-flex;">
        <img src="../../img/logo.png" alt="HotelBooking" class="logo-img" style="height: 80px !important; min-width: 210px !important; max-width: 300px !important;">
      </a>
    </div>
  </header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px;">
    <div class="card p-4" style="max-width: 460px; width: 100%; padding: 36px 32px; box-shadow: var(--shadow-xl); border-radius: var(--radius-xl);">
      <div class="text-center" style="margin-bottom: 24px;">
        <h1 style="font-size: 1.6rem; font-weight: 800; color: var(--dark); margin-bottom: 6px;">Đăng Nhập Tài Khoản</h1>
        <p style="font-size: 0.875rem; color: var(--text-muted);">Chào mừng bạn quay trở lại với HotelBooking 5★</p>
      </div>

      <!-- Quick Demo Login Buttons -->
      <div style="background: var(--bg-card-alt); border-radius: var(--radius-md); padding: 14px 16px; margin-bottom: 24px; border: 1.5px dashed rgba(201, 162, 39, 0.45); box-shadow: 0 4px 14px rgba(15, 39, 71, 0.04);">
        <div style="font-size: 0.8rem; color: var(--dark); font-weight: 800; text-transform: uppercase; margin-bottom: 10px; display: flex; align-items: center; gap: 6px;">
          <span class="material-symbols-outlined text-primary" style="font-size: 18px;">bolt</span> Tài khoản thử nghiệm nhanh:
        </div>
        <div class="d-flex gap-2 flex-wrap">
          <button type="button" class="btn btn-sm btn-outline-primary" id="btn-quick-admin" style="font-size: 0.8rem; padding: 6px 12px; font-weight: 700; border-radius: 9999px;">👑 Admin</button>
          <button type="button" class="btn btn-sm btn-outline-primary" id="btn-quick-staff" style="font-size: 0.8rem; padding: 6px 12px; font-weight: 700; border-radius: 9999px;">👔 Staff</button>
          <button type="button" class="btn btn-sm btn-outline-primary" id="btn-quick-customer" style="font-size: 0.8rem; padding: 6px 12px; font-weight: 700; border-radius: 9999px;">👤 Khách hàng</button>
        </div>
      </div>

      <form id="form-login">
        <div class="form-group">
          <label class="form-label"><span class="material-symbols-outlined">mail</span> Địa chỉ email</label>
          <div class="input-icon-wrapper">
            <span class="material-symbols-outlined">email</span>
            <input type="email" id="login-email" class="form-control" placeholder="name@example.com" required>
          </div>
        </div>

        <div class="form-group">
          <div class="d-flex justify-between align-center" style="margin-bottom: 8px;">
            <label class="form-label" style="margin-bottom: 0;"><span class="material-symbols-outlined">lock</span> Mật khẩu</label>
            <a href="#" style="font-size: 0.8125rem; color: var(--primary); font-weight: 600;">Quên mật khẩu?</a>
          </div>
          <div class="input-icon-wrapper">
            <span class="material-symbols-outlined">key</span>
            <input type="password" id="login-password" class="form-control" placeholder="Nhập mật khẩu..." required>
          </div>
        </div>

        <div class="d-flex justify-between align-center" style="margin-bottom: 24px;">
          <label class="custom-checkbox">
            <input type="checkbox" id="login-remember">
            <span style="font-size: 0.85rem;">Ghi nhớ đăng nhập</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-bottom: 18px;">
          <span class="material-symbols-outlined icon-sm">login</span> Đăng Nhập
        </button>

        <div class="text-center" style="font-size: 0.875rem; color: var(--text-muted);">
          Chưa có tài khoản? <a href="register.html" id="link-to-register" style="color: var(--primary); font-weight: 700;">Đăng ký ngay</a>
        </div>
      </form>
    </div>
  </main>

  <footer style="text-align: center; padding: 20px; font-size: 0.8125rem; color: var(--text-muted);">
    &copy; 2026 HotelBooking. Bản quyền thuộc về Vũ Kim Quang.
  </footer>

  <!-- Scripts -->
  <script src="../../js/utils/formatters.js"></script>
  <script src="../../js/utils/toast.js"></script>
  <script src="../../js/data/seed-data.js"></script>
  <script src="../../js/data/firebase-config.js"></script>
  <script src="../../js/data/db.js"></script>
  <script src="../../js/auth/auth.js"></script>
  <script src="../../js/utils/animations.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const redirect = urlParams.get('redirect');
      if (redirect) {
        const regLink = document.getElementById('link-to-register');
        if (regLink) regLink.href = `register.html?redirect=${encodeURIComponent(redirect)}`;
      }

      const form = document.getElementById('form-login');
      const emailInput = document.getElementById('login-email');
      const passInput = document.getElementById('login-password');
      const rememberCheck = document.getElementById('login-remember');

      const savedEmail = localStorage.getItem('HB_REMEMBER_EMAIL');
      if (savedEmail && emailInput) {
        emailInput.value = savedEmail;
        if (rememberCheck) rememberCheck.checked = true;
      }

      document.getElementById('btn-quick-admin')?.addEventListener('click', () => {
        emailInput.value = 'admin@hotelbooking.vn';
        passInput.value = 'admin123';
      });

      document.getElementById('btn-quick-staff')?.addEventListener('click', () => {
        emailInput.value = 'staff@hotelbooking.vn';
        passInput.value = 'staff123';
      });

      document.getElementById('btn-quick-customer')?.addEventListener('click', () => {
        emailInput.value = 'khachhang@gmail.com';
        passInput.value = 'user123';
      });

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const res = Auth.login(emailInput.value.trim(), passInput.value, rememberCheck?.checked);

        if (res.success) {
          Toast.success('Thành công', res.message);
          setTimeout(() => {
            const urlParams = new URLSearchParams(window.location.search);
            const redirect = urlParams.get('redirect');
            if (redirect) {
              window.location.href = redirect;
            } else if (res.user.role === 'ADMIN' || res.user.role === 'SUPER_ADMIN' || res.user.role === 'STAFF') {
              window.location.href = '../admin/index.html';
            } else {
              window.location.href = '../../index.html';
            }
          }, 800);
        } else {
          Toast.error('Đăng nhập thất bại', res.message);
        }
      });
    });
  </script>
  <script src="../../js/utils/social-floating.js?v=9.0"></script>
  <script src="../../js/utils/chatbox.js?v=9.0"></script>
</body>
</html>
